name: Static checks

on:
  push:
    branches:
      - master
      - 'agent/**'
  pull_request:
    branches:
      - master

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify local assets and links
        run: python scripts/check_static.py
